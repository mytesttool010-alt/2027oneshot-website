  </head>
  <body class="bg-twilight text-slate-100 antialiased"><div class="site-sky fixed inset-0 -z-10"></div>
    <header class="border-b border-white/10 bg-[#11152f]/80 backdrop-blur-lg"><nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3 sm:px-8" aria-label="主导航"><a class="flex items-center gap-3" href="index.html"><img class="h-9 w-auto" src="assets/logo.webp" alt="OneShot" /><span class="hidden border-l border-white/20 pl-3 text-sm font-medium tracking-[.16em] text-lamp sm:block">2027 拜年纪</span></a><div class="flex items-center gap-1 text-sm font-medium sm:gap-4"><a class="rounded-full px-3 py-2 hover:bg-white/10" href="index.html">首页</a><a class="rounded-full px-3 py-2 hover:bg-white/10" href="archive.html">历年观影馆</a><a class="rounded-full bg-niko px-4 py-2 text-slate-950" href="comments.html">留言墙</a></div></nav></header>
    <main class="mx-auto max-w-5xl px-5 py-14 sm:px-8 sm:py-20"><div class="text-center"><p class="text-sm font-semibold tracking-[.3em] text-niko">MESSAGE WALL</p><h1 class="mt-3 text-4xl font-black sm:text-5xl">留一盏灯，给远方的朋友</h1><p class="mx-auto mt-5 max-w-xl leading-7 text-slate-300">不需要真实姓名。写下你的祝福、回忆或期待，让它和大家的灯火汇在一起。</p></div>
      <section class="glass-card mx-auto mt-10 max-w-3xl p-5 sm:p-8" aria-labelledby="form-title"><h2 id="form-title" class="text-xl font-bold">写下你的留言</h2><form class="mt-6 space-y-5" data-comment-form><label class="block text-sm font-medium text-slate-200" for="nickname">昵称 <span class="font-normal text-slate-400">（选填）</span><input class="form-input mt-2" id="nickname" name="nickname" maxlength="50" placeholder="TheWorldMa" /></label><label class="block text-sm font-medium text-slate-200" for="content">留言内容<textarea class="form-input mt-2 min-h-32 resize-y" id="content" name="content" maxlength="200" required placeholder="新年快乐！愿灯火永不熄灭。"></textarea><span class="mt-2 block text-right text-xs text-slate-400"><span data-character-count>0</span> / 200</span></label><div class="flex flex-wrap items-center justify-between gap-3"><p class="text-xs text-slate-400">提交后需等待 10 秒才能再次留言。</p><button class="rounded-full bg-niko px-6 py-3 text-sm font-bold text-slate-950 transition hover:bg-lamp disabled:cursor-not-allowed disabled:opacity-50" type="submit">点亮留言</button></div><p class="hidden text-sm" data-form-message role="status"></p></form></section>
      <section class="mt-14" aria-labelledby="messages-title"><div class="flex items-center justify-between"><h2 id="messages-title" class="text-2xl font-black">大家的灯火</h2><span class="text-sm text-slate-400">最新留言优先</span></div><div class="mt-6 grid gap-4" data-comment-list><div class="rounded-2xl border border-dashed border-white/20 bg-slate-950/20 px-6 py-10 text-center text-slate-400">留言将会在这里出现。</div></div></section>
    </main><footer class="border-t border-white/10 px-5 py-8 text-center text-sm text-slate-400">2027 OneShot 拜年纪 · Fan Project</footer><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabaseClient.js"></script><script defer src="js/api.js"></script><script defer src="js/main.js"></script>
