<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2023 至 2027 OneShot 拜年纪历年观影馆" />
    <title>历年观影馆｜2027 OneShot 拜年纪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { twilight: '#11152f', niko: '#f6ad2c', lamp: '#ffdb68' } } } };</script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/transitions.css" />
  </head>
  <body class="bg-twilight text-slate-100 antialiased">
    <div class="archive-background" aria-hidden="true"><div class="archive-background__layer is-active" data-background-layer></div><div class="archive-background__layer" data-background-layer></div></div>
    <header class="sticky top-0 z-20 border-b border-white/10 bg-[#11152f]/80 backdrop-blur-lg"><nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3 sm:px-8" aria-label="主导航"><a class="flex items-center gap-3" href="index.html"><img class="h-9 w-auto" src="assets/logo.webp" alt="OneShot" /><span class="hidden border-l border-white/20 pl-3 text-sm font-medium tracking-[.16em] text-lamp sm:block">2027 拜年纪</span></a><div class="flex items-center gap-1 text-sm font-medium sm:gap-4"><a class="rounded-full px-3 py-2 hover:bg-white/10" href="index.html">首页</a><a class="rounded-full bg-niko px-4 py-2 text-slate-950" href="archive.html">历年观影馆</a><a class="rounded-full px-3 py-2 hover:bg-white/10" href="comments.html">留言墙</a></div></nav></header>
    <main class="relative z-10 mx-auto max-w-6xl px-5 py-14 sm:px-8 sm:py-20">
      <div class="max-w-3xl"><p class="text-sm font-semibold tracking-[.3em] text-niko">ARCHIVE CINEMA</p><h1 class="mt-3 text-4xl font-black sm:text-6xl">每一年的灯火<br /><span class="text-lamp">都没有熄灭</span></h1><p class="mt-5 max-w-2xl leading-8 text-slate-200">从第一次相聚，到重返高塔。选择一个年份，重温直播与每一份用心完成的投稿。</p></div>
      <div class="mt-10 flex flex-wrap gap-2" role="tablist" aria-label="选择年份"><button class="year-tab" data-year="2023" role="tab">2023</button><button class="year-tab" data-year="2024" role="tab">2024</button><button class="year-tab" data-year="2025" role="tab">2025</button><button class="year-tab" data-year="2026" role="tab">2026</button><button class="year-tab" data-year="2027" role="tab">2027</button></div>
      <section class="mt-8 overflow-hidden rounded-3xl border border-white/15 bg-slate-950/70 shadow-2xl"><div class="grid lg:grid-cols-[1.5fr_1fr]"><div class="aspect-video bg-black"><iframe class="h-full w-full" data-player title="拜年纪直播回放" src="" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><div class="grid h-full place-items-center px-6 text-center" data-player-placeholder hidden><div><span class="text-4xl text-lamp">☀</span><p class="mt-4 font-bold text-white">直播回放敬请期待</p><p class="mt-2 text-sm text-slate-400">信息公布后将更新在这里。</p></div></div></div><div class="flex flex-col justify-center p-7 sm:p-10"><p class="text-sm font-semibold tracking-[.2em] text-niko" data-year-label></p><h2 class="mt-3 text-2xl font-black leading-tight sm:text-3xl" data-title></h2><p class="mt-5 leading-7 text-slate-300" data-description></p><a class="mt-7 inline-flex w-fit items-center gap-2 rounded-full border border-lamp/60 px-5 py-2.5 text-sm font-bold text-lamp transition hover:bg-lamp hover:text-slate-950" data-bilibili-link href="#" target="_blank" rel="noopener noreferrer">前往 Bilibili 观看 <span aria-hidden="true">↗</span></a></div></div></section>
      <section class="mt-14"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-sm font-semibold tracking-[.24em] text-niko">CONTRIBUTIONS</p><h2 class="mt-2 text-3xl font-black" data-program-heading>节目单</h2></div><p class="text-sm text-slate-300" data-program-count></p></div><div class="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-3" data-program-list></div></section>
      <section class="glass-card mt-14 p-6 sm:p-8" data-credits-section><p class="text-sm font-semibold tracking-[.24em] text-niko">INTERLUDE TEAM</p><h2 class="mt-3 text-2xl font-black">过场组</h2><div class="mt-5 grid gap-4 text-sm leading-7 text-slate-300 sm:grid-cols-2" data-credits></div></section>
    </main>
    <footer class="relative z-10 border-t border-white/10 bg-[#11152f]/70 px-5 py-8 text-center text-sm text-slate-400">2027 OneShot 拜年纪 · Fan Project</footer>
    <script defer src="js/archive.js"></script>
  </body>
</html>
